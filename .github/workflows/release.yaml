name: 'Release'
on:
  push:
    # take no actions on push to any branch...
    branches-ignore:
      - '**'
    # ... only act on release tags
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GO_VERSION: "1.26.X"

jobs:
  wait-for-checks:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          # full history so the GA marker commit's parent (the RC commit) is
          # available for the on-main ancestry check below.
          fetch-depth: 0
          persist-credentials: false

      # We don't want to release commits pushed + tagged but not merged onto
      # main. A GA tag is the exception: it sits on a release-marker commit whose
      # PARENT is the e2e-validated RC commit (on main); the marker commit itself
      # only reaches main later, via the release PR. So accept the tagged commit
      # being on main OR its first parent being on main.
      - name: Ensure tagged commit is on main
        run: |
          set -eu
          TAG="${GITHUB_REF##*/}"
          echo "Tag: ${TAG}"
          git fetch origin main
          if git merge-base --is-ancestor "${TAG}" origin/main; then
            echo "${TAG} is a commit on main!"
          elif git merge-base --is-ancestor "${TAG}^" origin/main \
               && [ "$(git diff --name-only "${TAG}^" "${TAG}")" = "README.md" ]; then
            # GA release-marker commit: exactly one commit atop the on-main RC
            # commit, changing ONLY the README marker line — so the built binary
            # is identical to the reviewed, on-main parent. Any commit carrying
            # other changes on top of main (e.g. unmerged code) is refused, even
            # though its parent is on main.
            echo "${TAG} is the release-marker commit (only README.md changed atop main) — ok."
          else
            echo "::error::${TAG} is not on main, and it is not a README-only marker commit atop main — refusing to release." >&2
            exit 1
          fi

      - name: Check static analysis
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: static-analysis
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github actions job name (in .github/workflows/static-analysis-integration.yaml)
          checkName: "Static-Analysis (1.26.X, ubuntu-latest)"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check unit, and integration test results
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: tests-unit-int
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github actions job name (in .github/workflows/static-analysis-integration.yaml)
          checkName: "Tests (1.26.X, ubuntu-latest)"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check CodeQL analysis results
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: codeql
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github actions job name + matrix language (in .github/workflows/codeql-analysis.yml)
          checkName: "Analyze (go)"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Quality gate
        if: steps.static-analysis.outputs.conclusion != 'success' || steps.tests-unit-int.outputs.conclusion != 'success' || steps.codeql.outputs.conclusion != 'success'
        run: |
          echo "Static-Analysis Status : ${STEPS_STATIC_ANALYSIS_OUTPUTS_CONCLUSION}"
          echo "Unit/Integration Status : ${STEPS_TESTS_UNIT_INT_OUTPUTS_CONCLUSION}"
          echo "CodeQL Status : ${STEPS_CODEQL_OUTPUTS_CONCLUSION}"
          false
        env:
          STEPS_STATIC_ANALYSIS_OUTPUTS_CONCLUSION: ${{ steps.static-analysis.outputs.conclusion }}
          STEPS_TESTS_UNIT_INT_OUTPUTS_CONCLUSION: ${{ steps.tests-unit-int.outputs.conclusion }}
          STEPS_CODEQL_OUTPUTS_CONCLUSION: ${{ steps.codeql.outputs.conclusion }}

  release:
    needs: [ wait-for-checks ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # required for goreleaser signs section with cosign
      id-token: write
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Restore bootstrap cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/.tmp
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}-
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
          lookup-only: true

      - name: Bootstrap dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: make ci-bootstrap

      - name: Login to Docker Hub
        id: docker-login
        run: |
          echo "${DOCKER_PASS}" | docker login -u "${DOCKER_USER}" --password-stdin
        env:
          DOCKER_USER: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_USERNAME }}
          DOCKER_PASS: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_PAT }}

      - name: Build snapshot artifacts
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: artifacts
          path: dist/**/*

  # RC only: once the RC image is built + published above, kick off the
  # downstream CircleCI e2e pipeline. GA tags skip this (a GA is only cut after
  # e2e passes). Called as a reusable workflow rather than reacting to
  # release.prereleased: goreleaser publishes the release with GITHUB_TOKEN, and
  # GitHub suppresses Actions triggers for GITHUB_TOKEN-created events, so a
  # release-event reaction never fires. This job runs inside the (App-token)
  # tag-push run, so it isn't suppressed. promote=true because this is the
  # automatic pipeline path (a successful e2e should drive the GA).
  trigger-e2e:
    needs: [release]
    if: ${{ contains(github.ref_name, '-rc') }}
    uses: ./.github/workflows/trigger-circleci-e2e.yaml
    with:
      tag: ${{ github.ref_name }}
      promote: true
    # Run the called workflow with our secret access so its `trigger` job (which
    # declares `environment: e2e`) can resolve the e2e ENVIRONMENT secrets
    # (CIRCLECI_API_TOKEN / CIRCLECI_PROJECT_SLUG). `inherit` keeps them
    # environment-scoped: explicit `secrets: {NAME: ...}` would be evaluated in
    # this caller job (which has no environment) and force a repo-level copy.
    secrets: inherit # zizmor: ignore[secrets-inherit] required to reach the e2e env secrets from the reusable workflow

