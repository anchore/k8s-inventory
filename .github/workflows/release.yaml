name: 'Release'
on:
  push:
    # take no actions on push to any branch...
    branches-ignore:
      - '**'
    # ... only act on release tags
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GO_VERSION: "1.26.X"

jobs:
  wait-for-checks:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      # we don't want to release commits that have been pushed and tagged, but not necessarily merged onto main
      - name: Ensure tagged commit is on main
        run: |
          echo "Tag: ${GITHUB_REF##*/}"
          git fetch origin main
          git merge-base --is-ancestor ${GITHUB_REF##*/} origin/main && echo "${GITHUB_REF##*/} is a commit on main!"

      - name: Check static analysis
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: static-analysis
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github actions job name (in .github/workflows/static-analysis-integration.yaml)
          checkName: "Static-Analysis (1.26.X, ubuntu-latest)"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check unit, and integration test results
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: tests-unit-int
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github actions job name (in .github/workflows/static-analysis-integration.yaml)
          checkName: "Tests (1.26.X, ubuntu-latest)"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check CodeQL analysis results
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: codeql
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github actions job name + matrix language (in .github/workflows/codeql-analysis.yml)
          checkName: "Analyze (go)"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Quality gate
        if: steps.static-analysis.outputs.conclusion != 'success' || steps.tests-unit-int.outputs.conclusion != 'success' || steps.codeql.outputs.conclusion != 'success'
        run: |
          echo "Static-Analysis Status : ${STEPS_STATIC_ANALYSIS_OUTPUTS_CONCLUSION}"
          echo "Unit/Integration Status : ${STEPS_TESTS_UNIT_INT_OUTPUTS_CONCLUSION}"
          echo "CodeQL Status : ${STEPS_CODEQL_OUTPUTS_CONCLUSION}"
          false
        env:
          STEPS_STATIC_ANALYSIS_OUTPUTS_CONCLUSION: ${{ steps.static-analysis.outputs.conclusion }}
          STEPS_TESTS_UNIT_INT_OUTPUTS_CONCLUSION: ${{ steps.tests-unit-int.outputs.conclusion }}
          STEPS_CODEQL_OUTPUTS_CONCLUSION: ${{ steps.codeql.outputs.conclusion }}

  release:
    needs: [ wait-for-checks ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # required for goreleaser signs section with cosign
      id-token: write
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Restore bootstrap cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/.tmp
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}-
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
          lookup-only: true

      - name: Bootstrap dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: make ci-bootstrap

      - name: Login to Docker Hub
        id: docker-login
        run: |
          echo "${DOCKER_PASS}" | docker login -u "${DOCKER_USER}" --password-stdin
        env:
          DOCKER_USER: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_USERNAME }}
          DOCKER_PASS: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_PAT }}

      # goreleaser picks the tag for a commit by reverse-lexicographic refname order, so a
      # bare vX.Y.Z tag always loses to a vX.Y.Z-rcN tag on the same commit. That would
      # silently rebuild and republish the RC instead of the final release. The workflow
      # already knows which tag it was triggered by, so pass it explicitly rather than
      # letting goreleaser guess.
      #
      # For a final release we also pin the changelog's starting point to the previous final
      # release. Left to itself goreleaser would start from the most recent RC, so the notes
      # would only cover commits landed after the last RC instead of the whole release.
      - name: Determine release tags
        id: release-tags
        run: |
          echo "current=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            previous=$(git tag -l 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vx "${GITHUB_REF_NAME}" \
              | head -1)
            echo "Final release ${GITHUB_REF_NAME}; changelog starts from ${previous:-<none>}"
            echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          else
            echo "Prerelease ${GITHUB_REF_NAME}; leaving changelog range to goreleaser"
          fi

      - name: Build snapshot artifacts
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.release-tags.outputs.current }}
          # Empty is safe: goreleaser falls back to auto-detection.
          GORELEASER_PREVIOUS_TAG: ${{ steps.release-tags.outputs.previous }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: artifacts
          path: dist/**/*

  # RC only: once the RC image is built + published above, kick off the
  # downstream CircleCI e2e pipeline. GA tags skip this (a GA is only cut after
  # e2e passes). Called as a reusable workflow rather than reacting to
  # release.prereleased: goreleaser publishes the release with GITHUB_TOKEN, and
  # GitHub suppresses Actions triggers for GITHUB_TOKEN-created events, so a
  # release-event reaction never fires. This job runs inside the (App-token)
  # tag-push run, so it isn't suppressed. promote=true because this is the
  # automatic pipeline path (a successful e2e should drive the GA).
  trigger-e2e:
    needs: [release]
    if: ${{ contains(github.ref_name, '-rc') }}
    uses: $/.github/workflows/trigger-circleci-e2e.yaml
    with:
      tag: ${{ github.ref_name }}
      promote: true
    # Run the called workflow with our secret access so its `trigger` job (which
    # declares `environment: e2e`) can resolve the e2e ENVIRONMENT secrets
    # (CIRCLECI_API_TOKEN / CIRCLECI_PROJECT_SLUG). `inherit` keeps them
    # environment-scoped: explicit `secrets: {NAME: ...}` would be evaluated in
    # this caller job (which has no environment) and force a repo-level copy.
    secrets: inherit # zizmor: ignore[secrets-inherit] required to reach the e2e env secrets from the reusable workflow

  # Alert Slack if any step of the build/publish/trigger chain fails. Covers RC
  # and GA runs (trigger-e2e is skipped on GA — a skipped need is not a failure,
  # so this stays quiet on a clean GA). e2e failures are alerted separately from
  # CircleCI; this is the GitHub Actions half. github.ref_name is the tag here.
  notify-failure:
    needs: [wait-for-checks, release, trigger-e2e]
    if: ${{ failure() }}
    uses: $/.github/workflows/notify-slack-failure.yaml
    with:
      subject: ${{ github.ref_name }}
    secrets:
      # left name = the reusable workflow's generic input; right = the actual repo/org secret.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_ANCHORE_INTEGRATION_RELEASE_ALERTS }}

